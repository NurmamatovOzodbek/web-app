<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IC3 GS6 Simulator Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 15px;
        color: #333;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        max-width: 600px;
        margin: 0 auto;
      }
      .q-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 15px;
        color: #1e293b;
      }
      .option-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        margin-bottom: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 14px;
      }
      .option-btn:hover {
        background: #f1f5f9;
      }
      .option-btn.selected {
        border-color: #3b82f6;
        background-color: #eff6ff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 10px;
        text-align: left;
        font-size: 13px;
      }
      th {
        background-color: #f8fafc;
      }
      .tf-radio {
        cursor: pointer;
        width: 18px;
        height: 18px;
      }
      .btn-submit {
        display: block;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
      }
      .btn-submit:hover {
        background: #16a34a;
      }
      .feedback {
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        display: none;
      }
      .correct {
        background: #dcfce7;
        color: #15803d;
      }
      .incorrect {
        background: #fee2e2;
        color: #b91c1c;
      }
      .nav-btns {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
      }
      .nav-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        background: #64748b;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="quiz-container"></div>
      <div id="feedback" class="feedback"></div>
      <button class="btn-submit" onclick="checkAnswer()">
        Javobni tekshirish
      </button>
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevQuestion()">
          Keyingisi/Oldingisi
        </button>
        <button class="nav-btn" onclick="nextQuestion()">
          Keyingi savol ➔
        </button>
      </div>
    </div>

    <script>
      // PDF fayldagi savollar bazasining namunasi (Barcha 80+ savollar shu ko'rinishda saqlanadi)
      const questions = [
        {
          id: 1,
          type: "checkbox",
          question:
            "Question 1: Your teacher instructs you to edit a classmate's research paper. Which two tools should you use? (Choose 2.)",
          options: [
            "A. Design mode",
            "B. Spelling checker",
            "C. Linked notes",
            "D. Comments",
          ],
          correct: [1, 3], // B va D (0-indexli ro'yxat)
        },
        {
          id: 5,
          type: "true_false",
          question:
            "Question 5: For each statement about the Android operating system, select True or False.",
          statements: [
            { text: "Android is open-source software", correct: "True" },
            { text: "Android is a desktop operating system", correct: "False" },
            { text: "Android requires the Google App Store", correct: "False" },
          ],
        },
        {
          id: 8,
          type: "matching",
          question: "Question 8: Move each AI term to its definition.",
          items: [
            {
              term: "Robotics",
              def: "Focuses on creating physical machines capable of performing tasks autonomously.",
            },
            {
              term: "Machine Learning",
              def: "Enables machines to gain knowledge from data without being explicitly programmed.",
            },
          ],
        },
      ];

      let currentQ = 0;

      function renderQuestion() {
        const q = questions[currentQ];
        const container = document.getElementById("quiz-container");
        document.getElementById("feedback").style.display = "none";
        let html = `<div class="q-title">${q.question}</div>`;

        if (q.type === "checkbox" || q.type === "single") {
          q.options.forEach((opt, idx) => {
            html += `<button class="option-btn" onclick="toggleSelect(${idx})" id="opt-${idx}">${opt}</button>`;
          });
        } else if (q.type === "true_false") {
          html += `<table><tr><th>Tasdiq</th><th>True</th><th>False</th></tr>`;
          q.statements.forEach((st, idx) => {
            html += `<tr>
                    <td>${st.text}</td>
                    <td style="text-align:center"><input type="radio" name="tf-${idx}" value="True" class="tf-radio"></td>
                    <td style="text-align:center"><input type="radio" name="tf-${idx}" value="False" class="tf-radio"></td>
                </tr>`;
          });
          html += `</table>`;
        }
        container.innerHTML = html;
      }

      let selectedOptions = [];
      function toggleSelect(idx) {
        const btn = document.getElementById(`opt-${idx}`);
        if (selectedOptions.includes(idx)) {
          selectedOptions = selectedOptions.filter((i) => i !== idx);
          btn.classList.remove("selected");
        } else {
          selectedOptions.push(idx);
          btn.classList.add("selected");
        }
      }

      function checkAnswer() {
        const q = questions[currentQ];
        const feedback = document.getElementById("feedback");
        let isCorrect = true;

        if (q.type === "checkbox") {
          if (
            selectedOptions.length !== q.correct.length ||
            !selectedOptions.every((val) => q.correct.includes(val))
          ) {
            isCorrect = false;
          }
        } else if (q.type === "true_false") {
          q.statements.forEach((st, idx) => {
            const checked = document.querySelector(
              `input[name="tf-${idx}"]:checked`
            );
            if (!checked || checked.value !== st.correct) {
              isCorrect = false;
            }
          });
        }

        feedback.style.display = "block";
        if (isCorrect) {
          feedback.className = "feedback correct";
          feedback.innerText = "To'g'ri javob! Barakalla!";
        } else {
          feedback.className = "feedback incorrect";
          feedback.innerText =
            "Noto'g'ri javob. Qayta urinib ko'ring yoki to'g'ri javoblarni yodda saqlang!";
        }
      }

      function nextQuestion() {
        if (currentQ < questions.length - 1) {
          currentQ++;
          selectedOptions = [];
          renderQuestion();
        }
      }

      function prevQuestion() {
        if (currentQ > 0) {
          currentQ--;
          selectedOptions = [];
          renderQuestion();
        }
      }

      renderQuestion();
    </script>
  </body>
</html>
